name: CI pipeline

on:
  workflow_dispatch:
  pull_request:
  merge_group:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Ruff check
        run: uv run ruff check src tests

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
    
      - name: Install the project
        run: uv sync --locked --all-extras --dev
  
      - name: Run tests
        run: uv run pytest

  test-release:
    # if: contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
    - lint
    - test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Build
        run: uv build --no-sources

      - name: Test release can be imported
        run: uv run --directory dist/ --with pg2_dataset --no-project -- python -c "import pg2_dataset" 

  github-release:
    runs-on: ubuntu-latest
    needs: test-release
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Get version
        id: get_version
        run: echo ::set-output name=VERSION::$(hatch version)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ github.event.head_commit.message }}
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'rc') ||  contains(steps.get_version.outputs.VERSION, 'b') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true