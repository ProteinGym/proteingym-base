[project]
name = "pg2-dataset"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tintinrevient", email = "zhaobenben007@googlemail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cloudpathlib>=0.21.0",
    "dvc[gs,s3]>=3.59.1",
    "loguru>=0.7.3",
    "polars[pyarrow]>=1.30.0",
    "pandas==2.2.3",
    "pydantic>=2.11.4",
    "toml>=0.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
biotite = ["biotite>=1.3.0"]
biopython = ["biopython>=1.85.0", "msgpack>=1.1.0"]

[dependency-groups]
dev = [
    "jupyterlab>=4.4.1",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "ruff>=0.11.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pg2_dataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["N805"]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "N", # pep8 naming
    "I", # isort
    # "C", # flake8-comprehensions
    "B", # flake8-bugbear
]
