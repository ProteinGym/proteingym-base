[project]
name = "pg2-dataset"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tintinrevient", email = "zhaobenben007@googlemail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cloudpathlib>=0.21.0",
    "dvc[gs,s3]>=3.59.1",
    "dvclive>=3.48.2",
    "loguru>=0.7.3",
    "pandas>=2.2.3",
    "polars>=1.28.1",
    "pyarrow>=20.0.0",
    "pydantic>=2.11.4",
    "scikit-learn>=1.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyterlab>=4.4.1",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "ruff>=0.11.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pg2_dataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
